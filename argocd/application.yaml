apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  
  # Source - Git repository containing manifests
  source:
    repoURL: https://github.com/Dhruvv34/devops-eks.git
    targetRevision: HEAD
    path: manifests
  
  # Destination - Target cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-app
  
  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
